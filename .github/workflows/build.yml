name: Build

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      check-release-build:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      check-release-build:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Show Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/ci
          key: xcode-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: |
            xcode-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-

      - name: Restore unchanged source timestamps
        run: python3 scripts/ci-source-mtimes.py build/ci/source-mtimes.json

      - name: Lint design tokens
        run: node scripts/lint-design-tokens.mjs

      - name: Check translations
        run: python3 scripts/check-localization.py

      - name: Build (ad-hoc signed)
        if: github.event_name == 'pull_request' || inputs.check-release-build
        run: |
          xcodebuild build \
            -project purge.xcodeproj \
            -scheme purge \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/ci \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=NO

      - name: Run unit tests
        timeout-minutes: 20
        run: |
          # These two suites deliberately exhaust Swift's worker pool. Run them
          # separately so unrelated async tests can finish before their deadlines.
          mkdir -p TestResults
          xcodebuild test \
            -parallel-testing-enabled NO \
            -project purge.xcodeproj \
            -scheme purge \
            -destination 'platform=macOS' \
            -derivedDataPath build/ci \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -skip-testing:PurgeTests/ProcessRunnerTests \
            -skip-testing:PurgeTests/FolderSizingConcurrencyTests \
            -resultBundlePath TestResults/UnitTests.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

      - name: Run process stress tests
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building \
            -parallel-testing-enabled NO \
            -project purge.xcodeproj \
            -scheme purge \
            -destination 'platform=macOS' \
            -derivedDataPath build/ci \
            -only-testing:PurgeTests/ProcessRunnerTests \
            -resultBundlePath TestResults/ProcessStressTests.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

      - name: Run folder sizing stress tests
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building \
            -parallel-testing-enabled NO \
            -project purge.xcodeproj \
            -scheme purge \
            -destination 'platform=macOS' \
            -derivedDataPath build/ci \
            -only-testing:PurgeTests/FolderSizingConcurrencyTests \
            -resultBundlePath TestResults/FolderSizingStressTests.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
