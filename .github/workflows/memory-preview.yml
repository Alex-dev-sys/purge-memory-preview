name: Memory preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Lint design tokens
        run: node scripts/lint-design-tokens.mjs
      - name: Check translations
        run: python3 scripts/check-localization.py
      - name: Build and run tests
        timeout-minutes: 20
        run: |
          mkdir -p TestResults
          xcodebuild test \
            -parallel-testing-enabled NO \
            -project purge.xcodeproj \
            -scheme purge \
            -destination 'platform=macOS' \
            -skip-testing:PurgeTests/ProcessRunnerTests \
            -skip-testing:PurgeTests/FolderSizingConcurrencyTests \
            -resultBundlePath TestResults/UnitTests.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-preview-test-results
          path: TestResults/
          if-no-files-found: ignore

  package-preview:
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Configure isolated preview identity
        run: python3 scripts/configure-memory-preview.py
      - name: Build preview app
        run: |
          xcodebuild clean build \
            -project purge.xcodeproj \
            -scheme purge \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES
      - name: Stage and package DMG
        id: package
        run: |
          set -euo pipefail
          APP="$(pwd)/build/Build/Products/Release/Purge.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Purge")"
          [[ " $ARCHS " == *" arm64 "* && " $ARCHS " == *" x86_64 "* ]]
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          BUILD="${GITHUB_RUN_NUMBER}"
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/Purge Memory Preview.app"
          ln -s /Applications "$STAGE/Applications"
          DMG="$RUNNER_TEMP/Purge-Memory-Preview-${VERSION}-${BUILD}.dmg"
          hdiutil create -volname 'Purge Memory Preview' -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$(basename "$DMG")") | tee "$RUNNER_TEMP/SHA256SUMS.txt"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
      - name: Upload preview artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-preview
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ runner.temp }}/SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="memory-preview-${{ steps.package.outputs.build }}"
          gh release create "$TAG" "${{ steps.package.outputs.dmg }}" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Memory preview ${{ steps.package.outputs.version }} (build ${{ steps.package.outputs.build }})" \
            --prerelease \
            --notes "Unsigned test build of the Memory preview. This DMG is not notarized; macOS may ask you to approve opening the app. The preview uses a separate bundle identifier and does not use the production Sparkle feed."
